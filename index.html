<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentToken 发射台 · 部署与管理</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="glow"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">AT</div>
    <div>
      <h1>AgentToken 发射台</h1>
      <p id="netLabel">未连接</p>
    </div>
  </div>
  <div class="topbar-right">
    <select id="chainSelect" class="select-sm">
      <option value="56">BSC 主网</option>
      <option value="97">BSC 测试网</option>
    </select>
    <button id="connectBtn" class="btn btn-primary">连接钱包</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="deploy">部署新代币</button>
  <button class="tab" data-tab="manage">合约管理</button>
</nav>

<main>
  <!-- ============ 部署 ============ -->
  <section id="tab-deploy" class="panel">
    <div class="grid-2">
      <div class="card">
        <h2>基本信息</h2>
        <div class="field"><label>代币名称</label><input id="f_name" value="test1" /></div>
        <div class="field"><label>代币符号</label><input id="f_symbol" value="TEST1" /></div>
        <div class="field"><label>门槛 NFT（Agent ID）</label><input id="f_agentId" value="0x60B9262456dE011F7d15a54CdD8c48bAaa8B022F" /><span class="hint">填 0x0000...0000 表示不设门槛</span></div>
      </div>

      <div class="card">
        <h2>链上地址</h2>
        <div class="field"><label>USDT 合约</label><input id="f_usdt" value="0x55d398326f99059fF775485246999027B3197955" /></div>
        <div class="field"><label>Pancake V2 Factory</label><input id="f_factory" value="0xcA143Ce32Fe78f1f7019d7d551a6402fC5350c73" /></div>
        <div class="field"><label>税收钱包</label><input id="f_taxWallet" placeholder="留空 = 部署者地址" /></div>
      </div>

      <div class="card">
        <h2>经济参数</h2>
        <div class="field-row">
          <div class="field"><label>每份价格（USDT）</label><input id="f_price" type="number" step="any" value="0.01" /></div>
          <div class="field"><label>USDT 小数位</label><input id="f_usdtDecimals" type="number" value="18" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>每份代币数量</label><input id="f_perMint" type="number" step="any" value="21000" /></div>
          <div class="field"><label>份数上限</label><input id="f_maxMints" type="number" step="1" value="21000" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>代币有效总量（硬顶）</label><input id="f_maxSupply" type="number" step="any" value="42000" /><span class="hint">链上总供应永不超过它 = 2 × 每份数量 × 份数上限</span></div>
          <div class="field"><label>&nbsp;</label><button id="autoSupplyBtn" class="btn btn-ghost">按硬顶自动分配每份</button></div>
        </div>
        <div class="field-row">
          <div class="field"><label>单地址上限</label><input id="f_maxPerWallet" type="number" step="1" value="3" /></div>
          <div class="field"><label>买卖税率（%）</label><input id="f_taxPct" type="number" step="any" value="1" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>LP 锁仓（天）</label><input id="f_lpLockDays" type="number" step="any" value="30" /></div>
          <div class="field"><label>mint 期限（天）</label><input id="f_mintWindowDays" type="number" step="any" value="7" /></div>
        </div>
      </div>

      <div class="card card-accent">
        <h2>开盘预览</h2>
        <ul class="preview" id="preview"></ul>
        <button id="deployBtn" class="btn btn-primary btn-block">部署合约</button>
        <p class="hint center">部署钱包需要一点 BNB 支付 gas，构造函数会立即创建交易对</p>
      </div>
    </div>

    <div id="deployResult" class="card hidden">
      <h2>部署结果</h2>
      <div class="kv"><span>合约地址</span><b id="r_addr"></b></div>
      <div class="kv"><span>交易哈希</span><b id="r_tx"></b></div>
      <div class="field">
        <label>构造参数（ABI 编码，验证合约时粘贴）</label>
        <textarea id="r_args" rows="3" readonly></textarea>
      </div>
      <div class="btn-row">
        <button id="copyArgsBtn" class="btn btn-ghost">复制构造参数</button>
        <button id="toManageBtn" class="btn btn-ghost">去管理这个合约</button>
        <a id="r_verify" class="btn btn-ghost" target="_blank" style="text-align:center">去 BscScan 验证</a>
      </div>
    </div>
  </section>

  <!-- ============ 管理 ============ -->
  <section id="tab-manage" class="panel hidden">
    <div class="card">
      <h2>载入合约</h2>
      <div class="field-row">
        <div class="field grow"><label>合约地址</label><input id="m_addr" placeholder="0x..." /></div>
        <div class="field"><label>&nbsp;</label><button id="loadBtn" class="btn btn-primary">载入</button></div>
      </div>
      <div class="field"><label>我的部署记录</label><select id="m_history"><option value="">— 无 —</option></select></div>
    </div>

    <div id="manageBody" class="hidden">
      <div class="card">
        <h2>实时状态 <button id="refreshBtn" class="btn btn-mini">刷新</button></h2>
        <div class="stats" id="m_stats"></div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h2>参与 mint</h2>
          <div class="stats mini" id="m_userStats"></div>
          <div class="field"><label>授权数量（USDT）</label><input id="m_approveAmt" type="number" step="any" value="1" /></div>
          <div class="btn-row">
            <button id="approveBtn" class="btn btn-ghost">授权 USDT</button>
            <button id="mintBtn" class="btn btn-primary">mint 一份</button>
          </div>
        </div>

        <div class="card card-danger">
          <h2>管理员操作</h2>
          <div class="btn-row">
            <button id="launchBtn" class="btn btn-primary">立即开盘</button>
            <button id="forceLaunchBtn" class="btn btn-ghost">强制开盘（到期后）</button>
          </div>
          <div class="field"><label>设置税收钱包</label><input id="m_newTaxWallet" placeholder="0x..." /></div>
          <button id="setTaxBtn" class="btn btn-ghost btn-block">更新税收钱包</button>
          <div class="field"><label>免税地址</label><input id="m_exemptAddr" placeholder="0x..." /></div>
          <div class="btn-row">
            <button id="exemptOnBtn" class="btn btn-ghost">加入免税</button>
            <button id="exemptOffBtn" class="btn btn-ghost">取消免税</button>
          </div>
          <div class="field"><label>NFT 门槛开关</label>
            <select id="m_gateSelect"><option value="true">开启（需持 NFT）</option><option value="false">关闭（任何人可 mint）</option></select>
          </div>
          <button id="setGateBtn" class="btn btn-ghost btn-block">保存开关</button>
          <div class="btn-row">
            <button id="sweepBtn" class="btn btn-ghost">取出误转 USDT</button>
            <button id="withdrawLpBtn" class="btn btn-danger">取出 LP</button>
          </div>
          <p class="hint">取出 LP / 取出误转 USDT 默认转到当前钱包地址</p>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script src="artifact.js"></script>
<script src="app.js"></script>
</body>
</html>
